input {
  beats {
    port => 5044
  }
}

filter {
  # Tag by service
  if [fields][service] == "traefik" and [fields][log_type] == "access" {
    # Traefik JSON access logs
    json {
      source => "message"
      target => "traefik"
      skip_on_invalid_json => true
    }
    mutate {
      add_field => { "[@metadata][index_prefix]" => "traefik-access" }
    }
  } else if [fields][service] == "wordpress" {
    # Apache combined log format
    grok {
      match => { "message" => "%{COMBINEDAPACHELOG}" }
      overwrite => [ "message" ]
      tag_on_failure => ["_grokparsefailure_apache"]
    }
    mutate {
      add_field => { "[@metadata][index_prefix]" => "wordpress" }
    }
  } else if [fields][service] == "keycloak" {
    # Keycloak log (usually key=value or JSON)
    json {
      source => "message"
      target => "keycloak"
      skip_on_invalid_json => true
    }
    mutate {
      add_field => { "[@metadata][index_prefix]" => "keycloak" }
    }
  } else if [fields][service] == "mariadb-wp" {
    mutate {
      add_field => { "[@metadata][index_prefix]" => "mariadb-wp" }
    }
  } else if [fields][service] == "mariadb-kc" {
    mutate {
      add_field => { "[@metadata][index_prefix]" => "mariadb-kc" }
    }
  } else if [fields][service] == "mariadb" {
    # Rétrocompatibilité avec les anciens logs
    mutate {
      add_field => { "[@metadata][index_prefix]" => "mariadb" }
    }
  } else {
    mutate {
      add_field => { "[@metadata][index_prefix]" => "misc" }
    }
  }

  # Common: add timestamp
  date {
    match => [ "timestamp", "dd/MMM/yyyy:HH:mm:ss Z", "ISO8601" ]
    target => "@timestamp"
    tag_on_failure => []
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "${ELASTICSEARCH_USERNAME}"
    password => "${ELASTICSEARCH_PASSWORD}"
    index => "%{[@metadata][index_prefix]}-%{+YYYY.MM.dd}"
  }
}
